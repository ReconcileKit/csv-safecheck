name: Capture production demo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-production-demo.yml"
      - "demo/**"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public demo harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install pinned demo dependencies
        working-directory: demo
        run: npm ci

      - name: Install the isolated Linux browser
        working-directory: demo
        run: npx playwright install --with-deps chromium

      - name: Verify the bounded capture plan
        working-directory: demo
        run: npm test

      - name: Record the actual production workflow
        working-directory: demo
        run: npm run capture

      - name: Upload raw capture and machine evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csv-safecheck-production-demo
          path: demo/artifacts/
          if-no-files-found: error
          retention-days: 1
